{% extends 'base.html' %}

{% block titre %}Connexion – VisitTrack{% endblock %}

{% block contenu %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm border-0">
                <div class="card-body p-5">

                    <h3 class="fw-bold mb-4 text-center" style="color: #1F3864;">
                        <i class="fas fa-user me-2"></i>Connexion
                    </h3>

                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email</label>
                            <input type="email" name="email"
                                   class="form-control" placeholder="votre@email.com" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Mot de passe</label>
                            <input type="password" name="password"
                                   class="form-control" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn w-100 btn-reserver py-2 fw-bold"
                                style="background:#1F3864; color:white;">
                            Se connecter
                        </button>
                    </form>

                    <hr class="my-4">
                    <p class="text-center text-muted mb-0">
                        Pas encore de compte ?
                        <a href="{% url 'accounts:inscription' %}" style="color: #2E75B6;">
                            S'inscrire
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
