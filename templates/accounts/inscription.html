{% extends 'base.html' %}

{% block titre %}Inscription – VisitTrack{% endblock %}

{% block contenu %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-0">
                <div class="card-body p-5">

                    <h3 class="fw-bold mb-4 text-center" style="color: #1F3864;">
                        <i class="fas fa-user-plus me-2"></i>Créer un compte
                    </h3>

                    <form method="post">
                        {% csrf_token %}
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Nom *</label>
                                <input type="text" name="nom"
                                       class="form-control" placeholder="Elmir" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold">Prénom *</label>
                                <input type="text" name="prenom"
                                       class="form-control" placeholder="Adam" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Email *</label>
                                <input type="email" name="email"
                                       class="form-control" placeholder="adam@email.com" required>
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold">Mot de passe *</label>
                                <input type="password" name="password"
                                       class="form-control" placeholder="••••••••" required>
                            </div>
                            <div class="col-12 mt-2">
                                <button type="submit"
                                        class="btn w-100 py-2 fw-bold"
                                        style="background:#1F3864; color:white;">
                                    <i class="fas fa-check me-2"></i>Créer mon compte
                                </button>
                            </div>
                        </div>
                    </form>

                    <hr class="my-4">
                    <p class="text-center text-muted mb-0">
                        Déjà un compte ?
                        <a href="{% url 'accounts:connexion' %}" style="color: #2E75B6;">
                            Se connecter
                        </a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
